name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bash setup-build-env.sh

      - name: Build and package (amd64, dynarec)
        run: |
          chmod +x build.sh setup-build-env.sh
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ./build.sh --deb --zip
          else
            ./build.sh --zip
          fi

      - name: Smoke test binary
        run: |
          file releases/linux/amd64/rpcemu-recompiler | grep -i ELF
          ls -la releases/linux/amd64/
          # Actually execute it. These paths run before any wxWidgets/GTK
          # initialisation, so they work with no display and catch a binary that
          # cannot start at all (bad link, missing library). The same script
          # runs on every platform, so the CLI is checked identically.
          bash tests/cli_smoke.sh releases/linux/amd64/rpcemu-recompiler

      # Boot the machine for real and look at the screen. Everything above stops
      # at "the binary starts and parses its arguments"; this drives a full boot
      # over the built-in VNC server, so a break in the CPU, memory, VIDC, ROM
      # loading or the VNC server itself shows up here rather than in a user's
      # first run. The test machine is seeded with a !Boot that runs Desktop, so
      # a healthy run reaches the RISC OS desktop; the check asks whether the
      # screen has a desktop's range of colour, not whether it matches a
      # reference image, so cosmetic changes cannot fail the build.
      - name: Headless boot and VNC screenshot
        timeout-minutes: 3
        run: |
          python3 tests/vnc_smoke.py \
            --binary releases/linux/amd64/rpcemu-recompiler \
            --save vnc-smoke.png

      - name: Upload the boot screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnc-smoke-linux-amd64
          path: vnc-smoke.png
          if-no-files-found: ignore

      - name: Upload Linux amd64 release
        uses: actions/upload-artifact@v4
        with:
          name: rpcemu-linux-amd64
          path: |
            releases/linux/amd64/
            releases/linux/*.tar.gz
            releases/linux/amd64/*.deb
          if-no-files-found: error

  linux-arm64:
    # Native arm64 hosted runner (free for public repos). The ARM dynarec backend
    # does not exist, so arm64 uses the interpreter (--interpreter).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bash setup-build-env.sh

      - name: Build and package (arm64, interpreter)
        run: |
          chmod +x build.sh setup-build-env.sh
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ./build.sh --interpreter --deb --zip
          else
            ./build.sh --interpreter --zip
          fi

      - name: Smoke test binary
        run: |
          file releases/linux/arm64/rpcemu-interpreter | grep -i ELF
          ls -la releases/linux/arm64/
          bash tests/cli_smoke.sh releases/linux/arm64/rpcemu-interpreter

      # Boot the machine for real and look at the screen. Everything above stops
      # at "the binary starts and parses its arguments"; this drives a full boot
      # over the built-in VNC server, so a break in the CPU, memory, VIDC, ROM
      # loading or the VNC server itself shows up here rather than in a user's
      # first run. The test machine is seeded with a !Boot that runs Desktop, so
      # a healthy run reaches the RISC OS desktop; the check asks whether the
      # screen has a desktop's range of colour, not whether it matches a
      # reference image, so cosmetic changes cannot fail the build.
      - name: Headless boot and VNC screenshot
        timeout-minutes: 3
        run: |
          python3 tests/vnc_smoke.py \
            --binary releases/linux/arm64/rpcemu-interpreter \
            --save vnc-smoke.png

      - name: Upload the boot screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnc-smoke-linux-arm64
          path: vnc-smoke.png
          if-no-files-found: ignore

      - name: Upload Linux arm64 release
        uses: actions/upload-artifact@v4
        with:
          name: rpcemu-linux-arm64
          path: |
            releases/linux/arm64/
            releases/linux/*.tar.gz
            releases/linux/arm64/*.deb
          if-no-files-found: error

  windows-amd64:
    # Native Windows build with MinGW-w64 via MSYS2 (MINGW64). Ships the
    # recompiler (full-speed dynarec; the JIT supports the Windows x64 ABI).
    # Uses build-windows.sh (build.sh is apt/.deb-only).
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-wxwidgets3.2-msw
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libvncserver

      - name: Build and stage release (native MSYS2)
        run: |
          chmod +x build-windows.sh
          ./build-windows.sh --zip

      - name: Smoke test binary (PE executable)
        run: |
          ls -la releases/windows/amd64/
          # Windows ships the recompiler (full-speed dynarec; the JIT now
          # supports the Windows x64 ABI).
          file releases/windows/amd64/rpcemu-recompiler.exe | grep -i 'PE32'
          # The same checks the other platforms run. This also exercises the
          # staged release as a user gets it, so it catches a DLL that
          # build-windows.sh failed to copy alongside the executable.
          bash tests/cli_smoke.sh releases/windows/amd64/rpcemu-recompiler.exe

      # Windows only: wxWidgets used to accept DOS-style "/switch" here and
      # answer an unrecognised one with its own error and usage dialogs, which
      # listed wx's options rather than RPCEmu's and would hang a runner with no
      # interactive desktop. Long options are the interface on every platform,
      # so "/H" must be reported like any other unknown option.
      - name: DOS-style switches are rejected
        timeout-minutes: 2
        run: |
          export RPCEMU_NO_GUI_MESSAGES=1
          # MSYS2 rewrites an argument that looks like a Unix path into a Windows
          # one, so a bare "/H" would arrive as "C:/msys64/H". Exclude it from
          # that conversion so the test sends what it means to send.
          export MSYS2_ARG_CONV_EXCL='*'
          exe=./releases/windows/amd64/rpcemu-recompiler.exe

          "$exe" /H > slash.txt 2>&1 && rc=0 || rc=$?
          cat slash.txt
          test "$rc" = "2" || { echo "expected exit 2 for /H, got $rc"; exit 1; }
          grep -qi "unknown option" slash.txt || { echo "/H was not reported as an unknown option"; exit 1; }
          # wx's own usage names options RPCEmu does not document.
          if grep -qi "verbose" slash.txt; then
            echo "wx's usage leaked into the message"
            exit 1
          fi
          rm -f slash.txt

      # Boot the machine for real and look at the screen. Everything above stops
      # at "the binary starts and parses its arguments"; this drives a full boot
      # over the built-in VNC server, so a break in the CPU, memory, VIDC, ROM
      # loading or the VNC server itself shows up here rather than in a user's
      # first run. The test machine is seeded with a !Boot that runs Desktop, so
      # a healthy run reaches the RISC OS desktop; the check asks whether the
      # screen has a desktop's range of colour, not whether it matches a
      # reference image, so cosmetic changes cannot fail the build.
      - name: Headless boot and VNC screenshot
        timeout-minutes: 3
        run: |
          python3 tests/vnc_smoke.py \
            --binary releases/windows/amd64/rpcemu-recompiler.exe \
            --save vnc-smoke.png

      - name: Upload the boot screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnc-smoke-windows-amd64
          path: vnc-smoke.png
          if-no-files-found: ignore

      - name: Upload Windows amd64 release
        uses: actions/upload-artifact@v4
        with:
          name: rpcemu-windows-amd64
          path: |
            releases/windows/amd64/
            releases/windows/*.zip
          if-no-files-found: error

  macos-x86_64:
    # Free Intel (macos-13) runners are effectively unavailable, so build the
    # x86_64 slice (WITH the dynarec) on an Apple Silicon runner: Apple clang
    # cross-compiles to x86_64 natively via CMAKE_OSX_ARCHITECTURES, we just
    # need x86_64 libraries (from a Rosetta x86_64 Homebrew - the arm64 Homebrew
    # in /opt/homebrew can't provide them) and Rosetta 2 to run the JIT test.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install x86_64 Homebrew + dependencies
        run: |
          # A separate Intel Homebrew installs into /usr/local (the arm64
          # Homebrew lives in /opt/homebrew); both coexist. The install script
          # is downloaded by the outer shell, then executed under Rosetta so it
          # provisions the x86_64 tree.
          if [ ! -x /usr/local/bin/brew ]; then
            script="$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c "$script"
          fi
          arch -x86_64 /usr/local/bin/brew install cmake ninja pkg-config wxwidgets sdl2 libvncserver

      - name: Build x86_64 slice + test (Rosetta)
        run: |
          chmod +x build-macos.sh
          # Resolve wx-config / pkg-config / cmake from the x86_64 Homebrew
          # (/usr/local) so the slice links x86_64 libraries; clang emits x86_64
          # via CMAKE_OSX_ARCHITECTURES (set in build-macos.sh). The JIT test
          # binary is x86_64 and runs under Rosetta.
          export PATH="/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig"
          ./build-macos.sh --arch x86_64

      - name: Upload x86_64 slice
        uses: actions/upload-artifact@v4
        with:
          name: macos-slice-x86_64
          # The staged tree, not just bin/: it carries this slice's bundled
          # dependencies, which only exist on this runner. The job that fuses the
          # slices installs no Homebrew packages of its own.
          path: build-mac-x86_64/appstage/
          if-no-files-found: error

  macos-arm64:
    # Apple Silicon runner: builds the arm64 slice. There is no ARM dynarec
    # backend, so arm64 uses the interpreter (RPCEMU_DYNAREC=OFF), mirroring the
    # Linux arm64 build. On Apple Silicon the x86_64 slice also runs via Rosetta.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja pkg-config wxwidgets sdl2 libvncserver

      - name: Build arm64 slice (interpreter) + test
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh --arch arm64

      - name: Upload arm64 slice
        uses: actions/upload-artifact@v4
        with:
          name: macos-slice-arm64
          path: build-mac-arm64/appstage/
          if-no-files-found: error

  macos-universal:
    # Fuse the two per-arch slices into a universal binary and stage the release.
    needs: [macos-x86_64, macos-arm64]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download x86_64 slice
        uses: actions/download-artifact@v4
        with:
          name: macos-slice-x86_64
          path: build-mac-x86_64/appstage

      - name: Download arm64 slice
        uses: actions/download-artifact@v4
        with:
          name: macos-slice-arm64
          path: build-mac-arm64/appstage

      - name: Fuse (lipo) + build RPCEmu.app + DMG
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh --fuse --zip

      - name: Smoke test app bundle
        run: |
          APP=releases/macos/RPCEmu.app
          MACOSD="$APP/Contents/MacOS"
          lipo -archs "$MACOSD/rpcemu"
          file "$MACOSD/rpcemu" | grep -i 'universal'
          test -f "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          ls -la releases/macos/*.dmg

          # Every library the bundle needs must be inside the bundle or part of
          # macOS. This is the check that matters: the shipped .app was once
          # unlaunchable because its binaries still referred to Homebrew's own
          # prefix, which exists on the machine that built it and nowhere else.
          # Done by reading the load commands rather than by launching anything,
          # so it is deterministic and cannot hang.
          echo "==> checking every dependency resolves inside the bundle or in macOS"
          for f in "$MACOSD"/* "$APP/Contents/Frameworks"/*; do
            [ -f "$f" ] || continue
            file "$f" | grep -q Mach-O || continue
            # Only the indented lines are dependencies. otool prints a header
            # line per architecture for a universal binary, and for a library its
            # own install name as the first entry, so both are filtered out -
            # taking them for dependencies is what made the first version of this
            # check report every file as depending on itself.
            otool -L "$f" | grep -E '^[[:space:]]' | awk '{print $1}' | while read -r dep; do
              [ "$(basename "$dep")" = "$(basename "$f")" ] && continue
              case "$dep" in
                /usr/lib/*|/System/*) ;;                      # part of macOS
                @executable_path/*|@loader_path/*|@rpath/*) ;; # inside the bundle
                *)
                  echo "::error::$(basename "$f") depends on '$dep', which will not exist on another machine"
                  echo BAD >> dep-check.fail
                  ;;
              esac
            done
          done
          # The loop above runs in a subshell (pipe), so the failure is recorded
          # in a file rather than a variable.
          if [ -f dep-check.fail ]; then
            exit 1
          fi
          echo "✓ all dependencies are bundled or system"

          # Then a bounded attempt at actually running it, for information only.
          # A GUI application launched with --help is expected to print usage and
          # exit before wxEntry(), and in the bundle it does not: it starts the
          # GUI instead, which is why this does not gate the build. It is kept
          # because the output says which, and because a binary that cannot load
          # at all fails here in seconds with dyld's own diagnosis.
          #
          # The watchdog is hand-rolled: macOS ships no timeout(1), and leaning
          # on the job-level timeout-minutes instead cost twenty minutes of
          # runner time the first time this test did not exit.
          try_help() {
            local out="help-$$.out" pid i
            rm -f "$out"
            "$@" --help >"$out" 2>&1 &
            pid=$!
            for i in $(seq 1 30); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              echo "note: '$*' did not exit within 30s; it started the GUI rather than printing usage."
            elif wait "$pid"; then
              if grep -q '^Usage:' "$out"; then
                echo "note: '$*' printed usage and exited."
              else
                echo "note: '$*' exited cleanly but printed no usage."
              fi
            else
              echo "note: '$*' exited non-zero. Output:"
              cat "$out"
            fi
          }
          # The staged slice as well as the bundled one: if that honours --help
          # and the bundled binary does not, the difference is the bundle rather
          # than the code. Restore the executable bit first - downloading an
          # artifact does not preserve it, which is why the last run could not
          # answer this.
          chmod +x build-mac-arm64/appstage/bin/rpcemu || true
          try_help build-mac-arm64/appstage/bin/rpcemu
          try_help "$MACOSD/rpcemu"

      # The same command-line checks the Linux and Windows jobs run. Not gating
      # yet: --help is known not to return inside the bundle (see the note
      # above), so this would fail for that reason rather than for anything it
      # is meant to catch. It runs so the output is on the record - once the
      # bundle honours --help, drop the "|| true" and macOS is held to the same
      # standard as the others.
      # TEMPORARY - not for merge.
      #
      # Question: is the image we instrument the image that actually runs?
      # A file-scope C++ static initialiser doing only open()/write() never
      # fires, yet Cocoa starts. That combination is hard to reconcile within a
      # single Mach-O image, so this checks identity (UUID) and whether the
      # constructor survived into __mod_init_func at all.
      - name: PROBE - image identity and constructor presence
        timeout-minutes: 8
        # Diagnostic only: never let one failing command hide the checks after
        # it. The previous run died in the UUID sweep and never reached the
        # initializer and dyld checks, which are the point of the exercise.
        continue-on-error: true
        shell: bash +e {0}
        run: |
          exe=releases/macos/RPCEmu.app/Contents/MacOS/rpcemu
          slice=build-mac-arm64/appstage/bin/rpcemu

          echo "=== A. bundle identity ==="
          plutil -p "RPCEmu.app/Contents/Info.plist" 2>/dev/null \
            || plutil -p releases/macos/RPCEmu.app/Contents/Info.plist
          echo "--- what is actually in Contents/MacOS ---"
          ls -la releases/macos/RPCEmu.app/Contents/MacOS/
          echo "--- codesign ---"
          codesign -dvvv releases/macos/RPCEmu.app 2>&1 | head -20

          echo
          echo "=== B. UUIDs at every stage of the pipeline ==="
          # Filenames and timestamps do not identify a Mach-O image; UUIDs do,
          # and they survive copies. If the binary that was built, the one that
          # was signed and the one in Contents/MacOS are not the same image,
          # that alone explains every observation.
          echo "--- as built (arm64 slice, pre-lipo) ---"
          dwarfdump --uuid "$slice" 2>&1 || true
          echo "--- as built (x86_64 slice, pre-lipo) ---"
          dwarfdump --uuid build-mac-x86_64/appstage/bin/rpcemu 2>&1 || true
          echo "--- fused and bundled (what we inspect, and what we run) ---"
          dwarfdump --uuid "$exe" 2>&1 || true
          echo "--- any other Mach-O in the bundle? ---"
          # "|| true" throughout: the last command of this loop is a test that
          # fails for every non-Mach-O file, and the step runs under bash -e.
          find releases/macos/RPCEmu.app -type f -perm +111 2>/dev/null \
            | while read -r f; do
                if file "$f" 2>/dev/null | grep -q Mach-O; then
                  echo "  $f"
                  dwarfdump --uuid "$f" 2>&1 | sed 's/^/    /'
                fi
              done || true

          echo
          echo "=== C. does the constructor survive into __mod_init_func? ==="
          for a in $(lipo -archs "$exe"); do
            echo "--- slice $a ---"
            otool -arch "$a" -l "$exe" | grep -A 6 -E 'sectname __mod_init_func' \
              || echo "  NO __mod_init_func section in this slice"
          done
          echo "--- contents of the init section (arm64) ---"
          otool -arch arm64 -s __DATA __mod_init_func "$exe" 2>/dev/null \
            || otool -arch arm64 -s __DATA_CONST __mod_init_func "$exe" 2>/dev/null \
            || echo "  (could not dump __mod_init_func)"

          echo
          echo "=== D. is our constructor symbol present at all? ==="
          nm -arch arm64 "$exe" 2>/dev/null | grep -iE 'StartupProbe|ProbeMark|GLOBAL__sub' \
            || echo "  no probe symbols (internal linkage may hide them; see C)"

          echo
          echo "=== C2. newer initializer formats (__init_offsets) ==="
          # Apple has moved these: older builds use __DATA,__mod_init_func,
          # newer linkers __DATA_CONST,__mod_init_func, and newest ld64 with
          # chained fixups uses __TEXT,__init_offsets. Absence of one proves
          # nothing on its own, so look for all three.
          for a in $(lipo -archs "$exe"); do
            echo "--- slice $a: initializer sections present ---"
            otool -arch "$a" -l "$exe" \
              | grep -E 'sectname (__mod_init_func|__init_offsets)' \
              || echo "  NONE of __mod_init_func / __init_offsets found"
          done
          echo "--- __TEXT,__init_offsets (arm64), if present ---"
          otool -arch arm64 -s __TEXT __init_offsets "$exe" 2>/dev/null | head -10 \
            || echo "  (no __init_offsets)"

          echo
          echo "=== C3. does _main disassemble as our code? ==="
          # If the bytes at LC_MAIN are not our prologue, the entry point is not
          # what the symbol table claims.
          otool -arch arm64 -tvV "$exe" 2>/dev/null \
            | sed -n '/^_main:/,/^_[A-Za-z]/p' | head -25 \
            || echo "  (could not disassemble _main)"

          echo
          echo "=== C4. ask dyld directly whether it runs our initializers ==="
          # DYLD_PRINT_INITIALIZERS is ignored under the hardened runtime, so
          # run the UNSIGNED staged slice as well as the bundled binary.
          for target in "$slice" "$exe"; do
            echo "--- DYLD_PRINT_INITIALIZERS on $target ---"
            rm -f /tmp/rpcemu-probe.log
            DYLD_PRINT_INITIALIZERS=1 "$target" --help > dyld-$$.txt 2>&1 &
            pid=$!
            for i in $(seq 1 10); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            kill -9 "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            grep -iE 'running initializer|rpcemu' dyld-$$.txt | head -8 \
              || echo "  (no initializer lines; dyld may have refused the variable)"
            [ -s /tmp/rpcemu-probe.log ] && echo "  PROBE FIRED:" && sed 's/^/    /' /tmp/rpcemu-probe.log
            rm -f dyld-$$.txt
          done

          echo
          echo "=== E. lldb: which image is loaded, and is OUR main reached? ==="
          # Scoped to the executable, not every image with a symbol named main.
          # Breaking on the NAME resolved across 38 images last time and proved
          # nothing. Break on the executable's own main, print the loaded
          # image's UUID for comparison with dwarfdump above, and stop at the
          # LC_MAIN address itself.
          lldb -b \
            -o 'breakpoint set --shlib rpcemu --name main' \
            -o 'breakpoint list' \
            -o 'image list -u rpcemu' \
            -o 'image dump sections rpcemu' \
            -o 'run --help' \
            -o 'thread backtrace' \
            -o 'quit' \
            "$exe" > lldb.out 2>&1 &
          pid=$!
          for i in $(seq 1 120); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill -9 "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          sed -n '1,70p' lldb.out

      - name: Command-line smoke test (informational)
        timeout-minutes: 3
        run: |
          bash tests/cli_smoke.sh releases/macos/RPCEmu.app/Contents/MacOS/rpcemu || \
            echo "note: the command-line checks did not pass on macOS; see above."

      # Boot the machine for real and look at the screen - see the Linux job for
      # why. Run the binary inside the bundle, which is what a user launches,
      # so a boot that only fails when bundled is caught here.
      - name: Headless boot and VNC screenshot
        timeout-minutes: 3
        run: |
          python3 tests/vnc_smoke.py \
            --binary releases/macos/RPCEmu.app/Contents/MacOS/rpcemu \
            --save vnc-smoke.png

      - name: Upload the boot screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnc-smoke-macos-universal
          path: vnc-smoke.png
          if-no-files-found: ignore

      - name: Upload macOS universal release
        uses: actions/upload-artifact@v4
        with:
          name: rpcemu-macos-universal
          path: |
            releases/macos/*.dmg
            releases/macos/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux-amd64, linux-arm64, windows-amd64, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: upload

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            upload/**/*.deb
            upload/**/*.dmg
            upload/**/*.tar.gz
            upload/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
